<style>
  :root {

    --bg-sidebar: #0f172a;
    --bg-workspace: #0b1120;
    --bg-card: #131d33;
    --border-color: #1e293b;
    --border-accent: #2563eb;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --green: #4ade80;
    --yellow: #facc15;
    --purple: #c084fc;
    --rose: #fb7185;
    --emerald: #34d399;
    --status-done: #ef4444;
    --status-doing: #0284c7;
    --status-queue: #ca8a04;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-darkest);
    color: var(--text-primary);
    line-height: 1.4;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOP HEADER / DASHBOARD */
  .top-header {
    background: #090e17;
    border-bottom: 1px solid var(--border-color);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    z-index: 100;
  }
  .brand-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-icon {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
  }
  .app-title-box {
    display: flex;
    flex-direction: column;
  }
  .app-title {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #f8fafc;
  }
  .app-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* WALLET & METRICS */
  .header-metrics {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .metric-card {
    background: #111a2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 4px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .metric-label {
    font-size: 10.5px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }
  .metric-val {
    font-size: 14px;
    font-weight: 800;
  }
  .wallet-money {
    color: #4ade80;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 15px;
  }

  /* LOCK BUTTON */
  .btn-lock {
    background: #1e293b;
    border: 1px solid #334155;
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn-lock:hover {
    background: #334155;
    color: #fff;
  }

  /* MAIN LAYOUT: SIDEBAR + WORKSPACE */
  .app-main {
    flex: 1;
    display: flex;
    height: calc(100vh - 53px);
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-filter-box {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .search-input {
    width: 100%;
    background: #090e17;
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 6px 10px;
    color: #fff;
    font-size: 12px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .filter-tabs {
    display: flex;
    gap: 4px;
  }
  .filter-tab {
    flex: 1;
    background: #1e293b;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .filter-tab.active {
    background: var(--accent);
    color: #070b14;
    font-weight: 800;
  }

  /* PROFILE LIST IN SIDEBAR */
  .profile-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .profile-item {
    background: #111a2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s;
    user-select: none;
  }
  .profile-item:hover {
    background: #182440;
    border-color: #334155;
  }
  .profile-item.active {
    background: #1a2a4f;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
  }
  .item-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .item-badge {
    background: #1e293b;
    color: var(--accent);
    font-weight: 900;
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 5px;
    font-family: monospace;
  }
  .profile-item.active .item-badge {
    background: var(--accent);
    color: #070b14;
  }
  .item-name-block {
    display: flex;
    flex-direction: column;
  }
  .item-name {
    font-size: 12.5px;
    font-weight: 800;
    color: #f8fafc;
  }
  .item-sub {
    font-size: 11px;
    color: var(--text-muted);
  }
  .sidebar-tag-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 3px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .sidebar-tag-done { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
  .sidebar-tag-doing { background: #0c4a6e; color: #38bdf8; border: 1px solid #0284c7; }
  .sidebar-tag-queue { background: #713f12; color: #fef08a; border: 1px solid #ca8a04; }

  /* SIDEBAR MINI BUTTONS */
  .sidebar-status-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 5px;
  }
  .mini-status-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mini-status-btn:hover { filter: brightness(1.2); }
  .mini-status-btn.btn-done.active { background: #7f1d1d; color: #fecaca; border-color: #ef4444; }
  .mini-status-btn.btn-doing.active { background: #0c4a6e; color: #38bdf8; border-color: #0284c7; }
  .mini-status-btn.btn-queue.active { background: #713f12; color: #fef08a; border-color: #ca8a04; }

  /* WORKSPACE AREA */
  .workspace {
    flex: 1;
    background: var(--bg-workspace);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .ws-header {
    background: #090e17;
    border-bottom: 1px solid var(--border-color);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .ws-title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ws-folder-badge {
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: monospace;
  }
  .ws-profile-name {
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .ws-cycle-tag {
    background: #1e293b;
    color: #facc15;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .ws-status-pills {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ws-tag-pill {
    font-size: 11.5px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ws-pill-done { background: #1e293b; color: #94a3b8; }
  .ws-pill-done.active { background: #7f1d1d; color: #fecaca; border-color: #ef4444; }
  .ws-pill-doing { background: #1e293b; color: #94a3b8; }
  .ws-pill-doing.active { background: #0c4a6e; color: #38bdf8; border-color: #0284c7; }
  .ws-pill-queue { background: #1e293b; color: #94a3b8; }
  .ws-pill-queue.active { background: #713f12; color: #fef08a; border-color: #ca8a04; }

  /* WORKSPACE CONTENT GRID (2 COLUMNS) */
  .workspace-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }
  .ws-grid-2cols {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .app-main { flex-direction: column; height: auto; overflow: auto; }
    .sidebar { width: 100%; height: 260px; }
    .ws-grid-2cols { grid-template-columns: 1fr; }
    body { overflow: auto; height: auto; }
  }
  .ws-box {
    background: #111a2e;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .box-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    border-bottom: 1px solid #1e293b;
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* FIELD ROWS */
  .field-row {
    background: #090e17;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .field-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .field-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .field-val-big {
    font-size: 15px;
    font-weight: 800;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: #f8fafc;

  .val-phone { color: #38bdf8; font-size: 17px; }
  .val-cccd { color: #fb7185; font-size: 17px; }
  .val-dob { color: #facc15; }
  .val-date { color: #a78bfa; }
  .sim-badge {
    background: #0284c7;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
  }
  .btn-copy {
    background: #1e293b;
    border: 1px solid #334155;
    color: #38bdf8;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-copy:hover {
    background: var(--accent);
    color: #070b14;
  }

    background: rgba(14, 165, 233, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.3);

    padding: 10px 12px;
    margin-top: 4px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 6px;

  .sim-sms-title {

    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.5px;

    background: #090e17;
    padding: 8px 10px;
    border-radius: 6px;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px;
    color: #cbd5e1;
    line-height: 1.5;
    border: 1px dashed #334155;
    word-break: break-word;
    user-select: all;
  }

    overflow-x: auto;
  }
  .salary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .salary-table th {
    background: #090e17;
    color: var(--text-muted);
    font-weight: 700;
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid #1e293b;
    font-size: 11px;
    text-transform: uppercase;

  .salary-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #162035;
    vertical-align: middle;

  .salary-amount {

    font-weight: 900;
    color: #4ade80;

    font-weight: 800;
    color: #38bdf8;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    background: #090e17;
    border: 1px dashed #ca8a04;
    border-radius: 6px;
    padding: 6px 8px;
    color: #facc15;
    font-weight: 700;
    font-size: 13px;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .btn-memo-copy {
    background: #1e293b;
    border: 1px solid #ca8a04;
    color: #facc15;
    font-size: 10.5px;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* PIN LOCK OVERLAY */
  #pinLockOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, #0d1a33 0%, #060a12 100%);
    z-index: 999999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    transition: opacity 0.25s ease;
  }
  .pin-card {
    background: #111a2e;
    border: 1px solid #2563eb;
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    max-width: 95vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }
  .pin-shield-icon { font-size: 44px; margin-bottom: 8px; }
  .pin-title { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
  .pin-subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; text-align: center; }
  .pin-error-msg { color: #ef4444; font-size: 12px; font-weight: 700; min-height: 18px; margin-bottom: 10px; }
  .pin-dots-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #1e293b; border: 2px solid #334155;
    transition: all 0.2s;
  }
  .pin-dot.filled { background: #38bdf8; border-color: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
  .pin-dot.error { background: #ef4444; border-color: #ef4444; }
  .pin-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
  }
  .pin-key {
    background: #182440; border: 1px solid #25365e; color: #fff;
    font-size: 20px; font-weight: 800; height: 50px; border-radius: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .pin-key:hover { background: #2563eb; }
  .pin-key:active { transform: scale(0.95); }
  .pin-key-back { font-size: 15px; color: #cbd5e1; }

  /* TOAST NOTIFICATION */
  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0284c7;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    z-index: 1000000;
    display: none;
    transition: all 0.2s;
  }
</style>

// Helper Functions
function formatVND(val) {
  return (val || 0).toLocaleString('vi-VN') + ' VNĐ';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = msg;
  toast.style.display = 'block';
  toast.style.opacity = '1';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => { toast.style.display = 'none'; }, 200);
  }, 2000);
}

function copy(text, btn) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      const orig = btn.innerText;
      btn.innerText = 'ĐÃ COPY ✔';
      setTimeout(() => { btn.innerText = orig; }, 1200);
    }
    showToast('Đã copy: ' + text.slice(0, 35) + (text.length > 35 ? '...' : ''));
  }).catch(() => {
    const t = document.createElement('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
    if (btn) {
      const orig = btn.innerText;
      btn.innerText = 'ĐÃ COPY ✔';
      setTimeout(() => { btn.innerText = orig; }, 1200);
    }
    showToast('Đã copy!');
  });
}

// Status Persistence
function getAllStatuses() {
  try {
    return JSON.parse(localStorage.getItem('app_all_statuses') || '{}');
  } catch (e) {
    return {};
  }
}

function getProfileStatus(folder) {
  const all = getAllStatuses();
  if (all[folder]) return all[folder];
  if (all[String(folder)]) return all[String(folder)];
  const p = profilesData.find(item => item.folder === folder);
  return p ? p.default_status : 'queue';
}

function setStatus(folder, status) {
  const all = getAllStatuses();
  all[folder] = status;
  all[String(folder)] = status;
  try {
    localStorage.setItem('app_all_statuses', JSON.stringify(all));
    localStorage.setItem('status_' + folder, status);
    localStorage.setItem('profile_status_' + folder, status);
  } catch(e) {
    console.error(e);
  }

  const target = profilesData.find(item => item.folder === folder);
  if (target) target.default_status = status;

  renderProfileList();
  renderActiveProfile();
  updateWallet();

  if (status === 'done') {
    showToast('🎉 +300.000 đ vào ví (Đã xong F' + folder + ')');
  } else if (status === 'doing') {
    showToast('🔵 Đã chuyển F' + folder + ' sang Đang làm');
  } else {
    showToast('🟡 Đã chuyển F' + folder + ' sang Chờ');
  }
}

function cycleStatus(folder) {
  const current = getProfileStatus(folder);
  if (current === 'queue') setStatus(folder, 'doing');
  else if (current === 'doing') setStatus(folder, 'done');
  else setStatus(folder, 'queue');
}

// Unaccent helper
function removeVietnameseTones(str) {
  if (!str) return '';
  str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  str = str.replace(/[đĐ]/g, m => m === 'đ' ? 'd' : 'D');
  return str;
}

// SIM 1414 Text Generator
function getSimSmsText(p) {
  if (!p) return '';
  const cleanCccd = p.cccd.replace(/\s+/g, '');
  const unaccentName = removeVietnameseTones(p.name).toUpperCase();
  
  let noiCap = removeVietnameseTones(p.noi_cap || 'BO CONG AN').toUpperCase();
  if (noiCap.includes('CANH SAT') || noiCap.includes('CS')) {
    noiCap = 'CUC CS QLHC VE TTXH';
  } else {
    noiCap = 'BO CONG AN';
  }

  const sim = (p.sim || 'Viettel').toLowerCase();
  let hotline = '198 (0d)';
  if (sim.includes('vina')) hotline = '18001091 (0d)';
  else if (sim.includes('mobi')) hotline = '18001090 (0d)';

  const birthYear = parseInt(p.dob.split('/')[2]) || 1995;
  const actYear = Math.min(2023, Math.max(birthYear + 18, 2020));
  const monthNum = String((p.folder % 8) + 1).padStart(2, '0');
  const actDate = `18/${monthNum}/${actYear}`;

  return `Ho ten: ${unaccentName}, ngay sinh: ${p.dob}, The can cuoc: ${cleanCccd}, noi cap: ${noiCap}, ngay cap: ${p.ngay_cap}. Loai thue bao: tra truoc, ngay kich hoat: ${actDate}. The can cuoc cua Quy khach dang ky su dung thue bao: ${p.phone}. Lien he ${hotline} de biet them thong tin chi tiet. Tran trong!`;
}

// Company Memo Patterns
const COMPANY_PATTERNS = [
  (m, name) => `CONG TY THANH TOAN LUONG ${m.month} ${name}`,
  (m, name) => `CONG TY TNHH DV TM CHI TRA LUONG ${m.month} ${name}`,
  (m, name) => `CTY CP DAU TU & TM LUONG THANG ${m.month} ${name}`,
  (m, name) => `THANH TOAN TIEN LUONG THANG ${m.month} - ${name}`,
  (m, name) => `THANH TOAN LUONG ${m.month}`
];

function getMemo(p, s) {
  if (p.folder === 4) return `CONG TY THANH TOAN LUONG ${s.month.split('/')[0]}`;
  if (p.folder === 5) return `CONG TY THANH TOAN LUONG ${s.month.split('/')[0]} ${removeVietnameseTones(p.name).toUpperCase()}`;
  if (p.folder === 6) return `THANH TOAN TIEN LUONG THANG ${s.month.split('/')[0].replace('T', '')}/2026 - BVH`;
  const pat = COMPANY_PATTERNS[(p.folder - 1) % COMPANY_PATTERNS.length];
  return pat(s, removeVietnameseTones(p.name).toUpperCase());
}

// Wallet Update
function updateWallet() {
  let doneCount = 0;
  profilesData.forEach(p => {
    if (getProfileStatus(p.folder) === 'done') doneCount++;
  });
  const balance = doneCount * unitPrice;
  const el = document.getElementById('walletBalance');
  if (el) el.innerText = formatVND(balance);
  const doneEl = document.getElementById('walletDoneCount');
  if (doneEl) doneEl.innerText = doneCount;
}

// Profile Navigation & Render
function setActiveProfile(folder) {

function nextProfile(dir) {
  let currIdx = profilesData.findIndex(p => p.folder === activeFolder);
  let nextIdx = currIdx + dir;
  if (nextIdx < 0) nextIdx = profilesData.length - 1;
  if (nextIdx >= profilesData.length) nextIdx = 0;
  setActiveProfile(profilesData[nextIdx].folder);
}

function filterByStatus(filter) {

    if (matchesFilter && matchesSearch) {

// PIN Lock Management
function updatePinDots() {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach((d, idx) => {
    d.classList.toggle('filled', idx < currentPinInput.length);
    d.classList.remove('error');
  });
}

function pressPin(digit) {
  if (currentPinInput.length < 6) {
    currentPinInput += digit;
    updatePinDots();
    if (currentPinInput.length === 6) {
      setTimeout(verifyPin, 100);
    }
  }
}

function backspacePin() {
  if (currentPinInput.length > 0) {
    currentPinInput = currentPinInput.slice(0, -1);
    updatePinDots();
  }
}

function clearPin() {
  currentPinInput = "";
  updatePinDots();
}

function verifyPin() {
  if (currentPinInput === MASTER_PIN) {
    document.getElementById('pinErrorMsg').innerText = "";
    localStorage.setItem('app_unlocked', 'true');
    const overlay = document.getElementById('pinLockOverlay');
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 250);
    currentPinInput = "";
    updatePinDots();
    renderProfileList();
    renderActiveProfile();
    updateWallet();
    showToast("🔓 Đã mở khóa thành công!");
  } else {
    document.getElementById('pinErrorMsg').innerText = "❌ Mã PIN không đúng!";
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach(d => d.classList.add('error'));
    setTimeout(() => {
      currentPinInput = "";
      updatePinDots();
      document.getElementById('pinErrorMsg').innerText = "";
    }, 800);
  }
}

function lockAppNow() {
  localStorage.removeItem('app_unlocked');
  currentPinInput = "";
  updatePinDots();
  const overlay = document.getElementById('pinLockOverlay');
  overlay.style.display = 'flex';
  setTimeout(() => { overlay.style.opacity = '1'; }, 10);
  showToast("🔒 Đã khóa ứng dụng an toàn!");
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  // Initial render so content is ready
  renderProfileList();
  renderActiveProfile();
  updateWallet();

  const isUnlocked = localStorage.getItem('app_unlocked') === 'true';
  const overlay = document.getElementById('pinLockOverlay');
  if (!isUnlocked) {
    overlay.style.display = 'flex';
    overlay.style.opacity = '1';
  } else {
    overlay.style.display = 'none';
  }
});

// Keyboard PIN input
window.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('pinLockOverlay');
  if (overlay && overlay.style.display !== 'none') {
    if (e.key >= '0' && e.key <= '9') pressPin(e.key);
    else if (e.key === 'Backspace') backspacePin();
    else if (e.key === 'Escape') clearPin();
  }
});
</script>
