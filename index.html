<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORKSPACE QUẢN LÝ HỒ SƠ TÀI CHÍNH - WARM LUXURY UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F6F1EB;
    --bg-card: #FFFFFF;
    --bg-card-subtle: #FAF7F2;
    --bg-warm-light: #FFF5EC;
    --bg-accent-light: #FFE8D6;
    
    --primary: #FF7324;
    --primary-hover: #F05A0E;
    --primary-gradient: linear-gradient(135deg, #FF833D 0%, #EA580C 100%);
    --warm-gradient: linear-gradient(135deg, #FFF0E5 0%, #FFE2CC 100%);
    
    --text-main: #181C20;
    --text-sub: #4A5562;
    --text-muted: #7E8B9A;
    
    --border-light: #ECE4D9;
    --border-warm: #EED7BF;
    --shadow-soft: 0 8px 24px rgba(170, 130, 95, 0.06);
    --shadow-card: 0 4px 16px rgba(140, 100, 70, 0.04);
    --shadow-floating: 0 16px 40px rgba(220, 100, 30, 0.15);
    
    --status-done: #EF4444;
    --status-done-bg: #FEE2E2;
    --status-doing: #F59E0B;
    --status-doing-bg: #FEF3C7;
    --status-queue: #94A3B8;
    --status-queue-bg: #F1F5F9;
    
    --green-money: #15803D;
    --green-money-bg: #DCFCE7;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    line-height: 1.4;
    font-size: 14.5px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* TOP NAVBAR - COMPACT 50px */
  .top-navbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
    padding: 8px 24px;
    height: 52px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    z-index: 50;
    box-shadow: 0 2px 10px rgba(150, 110, 80, 0.03);
    flex-shrink: 0;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    background: var(--primary-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
  }

  .brand-text h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-text p {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .kpi-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-card-subtle);
    padding: 6px 14px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
  }

  .kpi-item {
    display: flex;
    flex-direction: column;
  }

  .kpi-label {
    font-size: 10px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .kpi-value {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--text-main);
  }

  .kpi-wallet {
    color: var(--primary);
  }

  .progress-capsule {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 8px;
    border-left: 1px solid var(--border-light);
  }

  .progress-track {
    width: 90px;
    height: 8px;
    background: #E2D9CF;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary-gradient);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border-light);
    background: var(--bg-card);
    color: var(--text-main);
    transition: all 0.2s;
  }

  .btn-action:hover {
    background: var(--bg-card-subtle);
    border-color: var(--primary);
    color: var(--primary);
  }

  .btn-primary {
    background: var(--primary-gradient);
    color: #fff;
    border: none;
    box-shadow: 0 3px 10px rgba(234, 88, 12, 0.22);
  }

  .btn-primary:hover {
    box-shadow: 0 5px 14px rgba(234, 88, 12, 0.3);
    transform: translateY(-1px);
    color: #fff;
  }

  /* MAIN LAYOUT - 2 PANELS ONLY (NO RIGHT INSPECTOR) */
  .app-container {
    display: flex;
    flex: 1;
    height: calc(100vh - 52px);
    overflow: hidden;
    padding: 12px 16px;
    gap: 14px;
  }

  /* LEFT SIDEBAR (SCROLLABLE LIST) */
  .sidebar-panel {
    width: 300px;
    min-width: 280px;
    max-width: 310px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
  }

  .sidebar-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
    background: #FFFDFC;
  }

  .search-box {
    position: relative;
    margin-bottom: 8px;
  }

  .search-input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    background: var(--bg-card-subtle);
    font-size: 13px;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s;
  }

  .search-input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 2px rgba(255, 115, 36, 0.15);
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13.5px;
    pointer-events: none;
  }

  /* Status Filter Pills */
  .status-pills {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .pill {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    background: var(--bg-card-subtle);
    color: var(--text-sub);
    border: 1px solid var(--border-light);
    white-space: nowrap;
    transition: all 0.15s;
  }

  .pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Bank Chips */
  .bank-chips {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .bank-chip {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    background: #F1ECE6;
    color: var(--text-sub);
    border: none;
    white-space: nowrap;
  }

  .bank-chip.active {
    background: #1C2024;
    color: #fff;
  }

  /* Profile List in Sidebar */
  .profile-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .profile-card-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: #FFFDFB;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .profile-card-item:hover {
    background: var(--bg-warm-light);
    border-color: var(--border-warm);
    transform: translateX(2px);
  }

  .profile-card-item.active {
    background: var(--bg-warm-light);
    border-color: var(--primary);
    box-shadow: 0 3px 12px rgba(255, 115, 36, 0.12);
  }

  .item-folder-badge {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #EFE7DE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-sub);
    flex-shrink: 0;
  }

  .profile-card-item.active .item-folder-badge {
    background: var(--primary-gradient);
    color: #fff;
  }

  .item-info {
    flex: 1;
    min-width: 0;
  }

  .item-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .tag-bank {
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 9.5px;
    background: #E8E1D7;
    color: var(--text-main);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.done { background: var(--status-done); box-shadow: 0 0 0 2px var(--status-done-bg); }
  .status-dot.doing { background: var(--status-doing); box-shadow: 0 0 0 2px var(--status-doing-bg); }
  .status-dot.queue { background: var(--status-queue); box-shadow: 0 0 0 2px var(--status-queue-bg); }

  /* MAIN WORKSPACE - FITS 100% IN SINGLE SCREEN WITHOUT SCROLL */
  .center-workspace {
    flex: 1;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-soft);
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    height: 100%;
    overflow: hidden;
  }

  /* Top Profile Banner (Single compact line) */
  .profile-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
  }

  .banner-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .banner-folder {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    background: var(--primary-gradient);
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.25);
    flex-shrink: 0;
  }

  .banner-titles h2 {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
    line-height: 1.2;
  }

  .banner-sub {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 3px;
  }

  .status-pill-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .status-pill-switch.done { background: var(--status-done-bg); color: var(--status-done); }
  .status-pill-switch.doing { background: var(--status-doing-bg); color: #B45309; }
  .status-pill-switch.queue { background: var(--status-queue-bg); color: #475569; }

  /* 3 MODULAR INFO CARDS GRID */
  .grid-info-cards {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    gap: 12px;
    flex-shrink: 0;
  }

  .info-module-card {
    background: var(--bg-card-subtle);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    position: relative;
    box-shadow: var(--shadow-card);
  }

  .module-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--border-warm);
  }

  /* FIELD ROWS WITH DEDICATED COPY BUTTON */
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px dashed rgba(220, 210, 200, 0.5);
  }

  .field-row:last-child {
    border-bottom: none;
  }

  .field-label {
    color: var(--text-muted);
    font-weight: 600;
    flex-shrink: 0;
    font-size: 12.5px;
  }

  .field-value-group {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
    min-width: 0;
  }

  .field-value {
    font-weight: 800;
    color: var(--text-main);
    font-size: 14.5px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .field-value.mono {
    font-family: 'JetBrains Mono', monospace;
  }

  /* INLINE 1-CLICK COPY BUTTON */
  .copy-btn-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 3px 8px;
    background: #FFFDFC;
    border: 1px solid var(--border-warm);
    border-radius: 6px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .copy-btn-inline:hover {
    background: var(--primary-gradient);
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(255, 115, 36, 0.25);
  }

  .copy-btn-highlight {
    background: var(--bg-warm-light);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 800;
  }

  /* ADDRESS BOX - NO QUÊ, ONLY HIỆN TẠI / TẠM TRÚ */
  .address-box-modern {
    background: #FFFFFF;
    border: 1.5px solid var(--border-warm);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 2px;
  }

  .address-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .address-badge {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .address-content-text {
    font-size: 14.5px;
    font-weight: 800;
    color: #111827;
    line-height: 1.35;
    background: var(--bg-warm-light);
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px dashed var(--border-warm);
  }

  /* SMS 1414 PREVIEW */
  .sms-preview-card {
    background: #FFFFFF;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 2px;
  }

  .sms-preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .sms-preview-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
    line-height: 1.35;
    background: var(--bg-card-subtle);
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    font-family: monospace;
    max-height: 60px;
    overflow-y: auto;
    word-break: break-all;
  }

  /* SALARY TABLE SECTION (FITS FULLY ON SCREEN) */
  .salary-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  .section-header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .salary-table-card {
    background: #fff;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-light);
    overflow: hidden;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
  }

  .salary-row {
    display: grid;
    grid-template-columns: 80px 180px 145px 145px 1fr 140px;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-light);
    font-size: 13.5px;
    gap: 10px;
  }

  .salary-row:last-child {
    border-bottom: none;
  }

  .salary-row.header {
    background: var(--bg-card-subtle);
    font-weight: 800;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 6px 14px;
  }

  .salary-month {
    font-weight: 800;
    color: var(--text-main);
    font-size: 14px;
  }

  .salary-date-badge {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .salary-date-val {
    font-weight: 700;
    color: var(--text-main);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }

  .salary-weekday-tag {
    font-size: 10.5px;
    font-weight: 700;
    color: #15803D;
  }

  .salary-amount-val {
    font-weight: 800;
    color: var(--green-money);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
  }

  .salary-balance-val {
    font-weight: 800;
    color: #1E293B;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
  }

  .salary-memo-text {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--bg-card-subtle);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    font-weight: 600;
  }

  .salary-actions {
    display: flex;
    gap: 5px;
    justify-content: flex-end;
  }

  /* TOAST NOTIFICATION */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1C2024;
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    z-index: 9999;
    display: none;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* PIN MODAL */
  .pin-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(28, 32, 36, 0.75);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }

  .pin-card {
    background: #fff;
    border-radius: var(--radius-xl);
    padding: 30px;
    width: 330px;
    box-shadow: var(--shadow-floating);
    text-align: center;
    border: 1px solid var(--border-warm);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pin-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--primary-gradient);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.25);
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 4px 0;
  }

  .pin-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid #CBD5E1;
    background: transparent;
    transition: all 0.2s;
  }

  .pin-dot.filled {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.1);
  }

  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .pin-key {

let activeFolderId = parseInt(localStorage.getItem('app_active_folder') || '1');

const UNIT_PRICE = 300000;

// PIN Management
function updatePinDots() {
  for (let i = 0; i < 6; i++) {
    const dot = document.getElementById('pdot' + i);
    if (dot) {
      dot.classList.toggle('filled', i < currentPinInput.length);
    }
  }
}

function pressPin(d) {
  if (currentPinInput.length < 6) {
    currentPinInput += d;
    updatePinDots();
    if (currentPinInput.length === 6) {
      setTimeout(verifyPin, 100);
    }
  }
}

function backspacePin() {
  if (currentPinInput.length > 0) {
    currentPinInput = currentPinInput.slice(0, -1);
    updatePinDots();
  }
}

function clearPin() {
  currentPinInput = "";
  updatePinDots();
}

function verifyPin() {
  if (currentPinInput === MASTER_PIN) {
    sessionStorage.setItem('app_pin_unlocked', 'true');
    document.getElementById('pinOverlay').style.display = 'none';
    showToast("🔓 Mở khóa Workspace thành công!");
  } else {
    showToast("❌ Sai mã PIN! Vui lòng thử lại.");
    clearPin();
  }
}

function lockAppNow() {
  sessionStorage.removeItem('app_pin_unlocked');
  clearPin();
  document.getElementById('pinOverlay').style.display = 'flex';
}

function checkPinOnLoad() {
  if (sessionStorage.getItem('app_pin_unlocked') === 'true') {
    document.getElementById('pinOverlay').style.display = 'none';
  } else {
    document.getElementById('pinOverlay').style.display = 'flex';
  }
}

function removeVietnameseTones(str) {
  if (!str) return "";
  str = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  str = str.replace(/[đĐ]/g, (m) => m === "đ" ? "d" : "D");
  return str.toUpperCase();
}

// Toast Helper
function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => {
    toast.style.display = 'none';
  }, 2200);
}

function copyText(txt, label) {
  if (!txt) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      showToast("✅ Đã copy: " + (label || txt));
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast("✅ Đã copy: " + (label || txt));
  }
}

// Status Management
function getProfileStatus(folderId) {
  const saved = localStorage.getItem('profile_status_' + folderId);
  if (saved) return saved;
  const p = profilesData.find(x => x.folder === folderId);
  return (p && p.default_status) ? p.default_status : 'queue';
}

function setProfileStatus(folderId, st) {
  localStorage.setItem('profile_status_' + folderId, st);
  updateKPI();
  renderProfileList();
  renderCenterWorkspace();
}

function cycleActiveStatus() {
  const cur = getProfileStatus(activeFolderId);
  let next = 'doing';
  if (cur === 'queue') next = 'doing';
  else if (cur === 'doing') next = 'done';
  else if (cur === 'done') next = 'queue';
  setProfileStatus(activeFolderId, next);
}

// KPI & Wallet
function updateKPI() {
  let doneCount = 0;
  let queueCount = 0;
  profilesData.forEach(p => {
    const st = getProfileStatus(p.folder);
    if (st === 'done') doneCount++;
    else queueCount++;
  });

  const wallet = doneCount * UNIT_PRICE;
  document.getElementById('topWalletBalance').innerText = wallet.toLocaleString('vi-VN') + ' VNĐ';
  document.getElementById('topProgressCount').innerText = doneCount + " / " + profilesData.length + " bộ";
  document.getElementById('topProgressBar').style.width = Math.round((doneCount / profilesData.length) * 100) + "%";
  
  const elDone = document.getElementById('countDone');
  const elQueue = document.getElementById('countQueue');
  if (elDone) elDone.innerText = doneCount;
  if (elQueue) elQueue.innerText = queueCount;
}

// Filters
function handleSearch(val) {
  currentSearchTerm = val.toLowerCase().trim();
  renderProfileList();
}

function setStatusFilter(st, btn) {
  currentStatusFilter = st;
  document.querySelectorAll('.status-pills .pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProfileList();
}

function setBankFilter(bname, btn) {
  currentBankFilter = bname;
  document.querySelectorAll('.bank-chips .bank-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProfileList();
}

// Render Sidebar List
function renderProfileList() {
  const container = document.getElementById('profileListContainer');
  container.innerHTML = '';

  const filtered = profilesData.filter(p => {
    const st = getProfileStatus(p.folder);
    if (currentStatusFilter !== 'all' && st !== currentStatusFilter) return false;
    
    if (currentBankFilter !== 'all') {
      const bname = (p.bank_name || '').toUpperCase();
      if (!bname.includes(currentBankFilter.toUpperCase())) return false;
    }

    if (currentSearchTerm) {
      const searchTarget = [
        p.name, p.cccd, p.phone, p.bank_stk, p.bank_name, p.hien_tai
      ].join(' ').toLowerCase();
      if (!searchTarget.includes(currentSearchTerm)) return false;
    }

    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Không tìm thấy hồ sơ</div>';
    return;
  }

  filtered.forEach(p => {
    const st = getProfileStatus(p.folder);
    const isActive = p.folder === activeFolderId;
    
    const card = document.createElement('div');
    card.className = 'profile-card-item' + (isActive ? ' active' : '');
    card.onclick = () => selectProfile(p.folder);
    
    let stClass = 'queue';
    if (st === 'done') stClass = 'done';
    else if (st === 'doing') stClass = 'doing';

    const shortBank = (p.bank_name || '').replace('Ngân hàng ', '').trim();

    card.innerHTML = `
      <div class="item-folder-badge">#${String(p.folder).padStart(2, '0')}</div>
      <div class="item-info">
        <div class="item-name">${p.name}</div>
        <div class="item-meta">
          <span class="tag-bank">${shortBank}</span>
          <span>${p.phone}</span>
        </div>
      </div>
      <div class="status-dot ${stClass}" title="Trạng thái: ${st}"></div>
    `;

    container.appendChild(card);
  });
}

function selectProfile(fid) {
  activeFolderId = fid;
  localStorage.setItem('app_active_folder', fid);
  renderProfileList();
  renderCenterWorkspace();
}

function getSms1414Text(p) {
  const cleanCccd = (p.cccd || '').replace(/\s+/g, '');
  const unaccentedName = removeVietnameseTones(p.name);
  const unaccentedNoiCap = removeVietnameseTones(p.noi_cap || 'CUC CS QLHC VE TTXH');
  return `Ho ten: ${unaccentedName}, ngay sinh: ${p.dob}, The can cuoc: ${cleanCccd}, noi cap: ${unaccentedNoiCap}, ngay cap: ${p.ngay_cap}. The can cuoc dang ky su dung thue bao: ${p.phone}.`;
}

            <button class="copy-btn-inline copy-btn-highlight" onclick="copyText('${smsSyntax}', 'Cú pháp gửi 1414')">📋 Copy Cú Pháp</button>
          </div>
        </div>

        <!-- Full SMS 1414 Preview Box -->
        <div class="sms-preview-card">
          <div class="sms-preview-header">
            <span>✉️ SMS 1414 MẪU (IN HOA - KHÔNG DẤU)</span>
            <button class="copy-btn-inline copy-btn-highlight" onclick="copyText(getSms1414Text(profilesData.find(x => x.folder === ${p.folder})), 'Toàn bộ SMS 1414')">📋 Copy Toàn Bộ</button>
          </div>
          <div class="sms-preview-text">${fullSms}</div>
        </div>
      </div>

      <!-- Card 3: Bank Account -->
      <div class="info-module-card">
        <div class="module-title">
          <span>🏦 TÀI KHOẢN NHẬN LƯƠNG</span>
          <button class="copy-btn-inline copy-btn-highlight" onclick="copyText('${p.bank_stk}', 'Số tài khoản')">📋 Copy STK</button>
        </div>
        
        <div class="field-row">
          <span class="field-label">Ngân hàng:</span>
          <div class="field-value-group">
            <span class="field-value">${p.bank_name}</span>
            <button class="copy-btn-inline" onclick="copyText('${p.bank_name}', 'Tên ngân hàng')">📋</button>
          </div>
        </div>

        <div class="field-row">
          <span class="field-label">Số tài khoản:</span>
          <div class="field-value-group">
            <span class="field-value mono" style="font-size: 16.5px; color: #1E293B;">${p.bank_stk}</span>
            <button class="copy-btn-inline copy-btn-highlight" onclick="copyText('${p.bank_stk}', 'Số tài khoản')">📋 Copy</button>
          </div>
        </div>

        <div class="field-row">
          <span class="field-label">Chủ tài khoản:</span>
          <div class="field-value-group">
            <span class="field-value">${p.bank_owner}</span>
            <button class="copy-btn-inline" onclick="copyText('${p.bank_owner}', 'Chủ tài khoản')">📋</button>
          </div>
        </div>

        <div class="field-row">
          <span class="field-label">Chu kỳ lương:</span>
          <div class="field-value-group">
            <span class="field-value">${p.cycle || 'Chu kỳ Mùng 10 (Né T7/CN)'}</span>
            <button class="copy-btn-inline" onclick="copyText('${p.cycle || 'Chu kỳ Mùng 10 (Né T7/CN)'}', 'Chu kỳ lương')">📋</button>
          </div>
        </div>

        <div class="field-row">
          <span class="field-label">Quy tắc số lẻ:</span>
          <div class="field-value-group">
            <span class="field-value" style="color: #15803D; font-weight: 800;">001 - 999 (Số dư > Tiền nhận)</span>
          </div>
        </div>

        <div class="field-row" style="margin-top: 4px;">
          <span class="field-label">Nơi cấp CCCD:</span>
          <div class="field-value-group">
            <span class="field-value" style="font-size: 12px;">${p.noi_cap}</span>
            <button class="copy-btn-inline" onclick="copyText('${p.noi_cap}', 'Nơi cấp')">📋</button>
          </div>
        </div>
      </div>

    </div>

    <!-- 4-Month Salaries Table (Compact, fits completely on single view) -->
    <div class="salary-section">
      <div class="section-header-box">
        <div class="section-title">
          <span>📊 LỊCH SỬ NHẬN LƯƠNG 4 THÁNG LIÊN TIẾP (CHUẨN HÀNH CHÍNH & SỐ LẺ 001-999)</span>
        </div>
      </div>

      <div class="salary-table-card">
        <div class="salary-row header">
          <div>Tháng</div>
          <div>Ngày giờ (Hành chính)</div>
          <div>Số tiền nhận (Lẻ)</div>
          <div>Số dư (Lớn hơn)</div>
          <div>Nội dung chuyển khoản</div>
          <div style="text-align: right;">Sao chép</div>
        </div>
        ${salariesHtml}
      </div>
    </div>
  `;
}

// Copy Zalo Summary
function copyZaloSummary() {
  let text = "DANH SÁCH 12 BỘ HỒ SƠ TÀI CHÍNH (ĐỦ VNeID + SIM 1414 + SAO KÊ LƯƠNG):\n\n";
  profilesData.forEach(p => {
    const num = String(p.folder).padStart(2, '0');
    text += `${num}. ${p.name} - ${p.bank_name} (STK: ${p.bank_stk})\n`;
  });
  copyText(text, "Danh sách 12 bộ gửi Zalo");
}

function copyFullActiveProfile() {
  const p = profilesData.find(x => x.folder === activeFolderId);
  if (!p) return;
  
  const text = `HỒ SƠ #${p.folder}: ${p.name}
- Ngày sinh: ${p.dob}
- CCCD: ${p.cccd} (Cấp: ${p.ngay_cap} tại ${p.noi_cap})
- SĐT: ${p.phone} (${p.sim})
- Địa chỉ hiện tại / Tạm trú: ${p.hien_tai}
- Ngân hàng: ${p.bank_name} - STK: ${p.bank_stk} (Chủ TK: ${p.bank_owner})`;

  copyText(text, `Trọn bộ thông tin ${p.name}`);
}

// Initialization
window.addEventListener('DOMContentLoaded', () => {
  checkPinOnLoad();
  updateKPI();
  renderProfileList();
  renderCenterWorkspace();

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (sessionStorage.getItem('app_pin_unlocked') !== 'true') return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'ArrowDown' || e.key === 'j') {
      let idx = profilesData.findIndex(x => x.folder === activeFolderId);
      if (idx < profilesData.length - 1) selectProfile(profilesData[idx + 1].folder);
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      let idx = profilesData.findIndex(x => x.folder === activeFolderId);
      if (idx > 0) selectProfile(profilesData[idx - 1].folder);
    }
  });
});
</script>
</body>
</html>
