<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORKSPACE QUẢN LÝ 12 BỘ HỒ SƠ - DẠNG TAB SIDEBAR & WORKSPACE</title>
<style>
  :root {
    --bg-darkest: #070b14;
    --bg-sidebar: #0f172a;
    --bg-workspace: #0b1120;
    --bg-card: #131d33;
    --border-color: #1e293b;
    --border-accent: #2563eb;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --green: #4ade80;
    --yellow: #facc15;
    --purple: #c084fc;
    --rose: #fb7185;
    --emerald: #34d399;
    --status-done: #ef4444;
    --status-doing: #0284c7;
    --status-queue: #ca8a04;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-darkest);
    color: var(--text-primary);
    line-height: 1.4;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOP HEADER / DASHBOARD */
  .top-header {
    background: #090e1a;
    border-bottom: 1px solid #1e293b;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .app-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  /* Month Buttons */
  .month-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #111827;
    padding: 4px 6px;
    border-radius: 8px;
    border: 1px solid #1f2937;
  }
  .btn-month {
    padding: 4px 10px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #94a3b8;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-month:hover { color: #fff; background: #1e293b; }
  .btn-month.active {
    background: #0284c7;
    color: #fff;
    box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
  }

  /* Wallet Pill */
  .wallet-pill {
    background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
    border: 1.5px solid #059669;
    border-radius: 10px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 0 15px rgba(5, 150, 105, 0.2);
  }
  .wallet-info {
    display: flex;
    flex-direction: column;
  }
  .wallet-label {
    font-size: 10px;
    font-weight: 800;
    color: #a7f3d0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .wallet-val {
    font-size: 18px;
    font-weight: 900;
    color: #34d399;
    font-family: monospace;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .wallet-val span { font-size: 11px; color: #6ee7b7; font-weight: 700; }
  .wallet-count-badge {
    background: #047857;
    color: #ecfdf5;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
  }

  /* MAIN APP LAYOUT (SPLIT SCREEN: SIDEBAR + WORKSPACE) */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT SIDEBAR: PROFILE LIST TABS */
  .sidebar {
    width: 320px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-filter-bar {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #0b1322;
  }
  .sidebar-search input {
    width: 100%;
    padding: 8px 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #fff;
    font-size: 12.5px;
    outline: none;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  
  .status-chips-filter {
    display: flex;
    gap: 4px;
  }
  .chip-btn {
    flex: 1;
    padding: 4px 6px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 800;
    cursor: pointer;
    background: #1e293b;
    color: #94a3b8;
    text-align: center;
    transition: 0.15s;
  }
  .chip-btn.active { color: #fff; }
  .chip-all.active { background: #475569; }
  .chip-doing.active { background: #0284c7; }
  .chip-queue.active { background: #ca8a04; color: #000; }
  .chip-done.active { background: #dc2626; }

  /* Profile list */
  .profile-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .profile-list::-webkit-scrollbar { width: 5px; }
  .profile-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  /* Profile Tab Item */
  .profile-item {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    background: #141f36;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    position: relative;
  }
  .profile-item:hover {
    background: #1c2b4a;
    border-color: #334155;
  }
  .profile-item.active {
    background: #172a50;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
  }
  .item-left {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }
  .item-badge {
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 900;
    background: #334155;
    color: #fff;
    min-width: 32px;
    text-align: center;
  }
  .profile-item.active .item-badge {
    background: var(--accent);
    color: #0b1120;
  }
  .item-name-block {
    overflow: hidden;
  }
  .item-name {
    font-size: 13px;
    font-weight: 800;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-sub {
    font-size: 11px;
    color: #94a3b8;
    white-space: nowrap;
  }
  
  .item-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot-done { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
  .status-dot-doing { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; }
  .status-dot-queue { background: #eab308; box-shadow: 0 0 6px #eab308; }

  /* RIGHT WORKSPACE: FULL PROFILE DETAILS */
  .workspace {
    flex: 1;
    background: var(--bg-workspace);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* Workspace Header */
  .workspace-header {
    background: #0f1a30;
    border-bottom: 1px solid #1e3a5f;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .ws-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ws-profile-badge {
    background: #2563eb;
    color: #fff;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 14px;
  }
  .ws-profile-name {
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .ws-cycle-tag {
    background: #1e3a5f;
    color: #93c5fd;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #2563eb;
  }

  .ws-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tag-switch-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0a1120;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }
  .ws-tag-pill {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid transparent;
    transition: 0.15s;
    user-select: none;
    white-space: nowrap;
  }
  .ws-tag-pill:hover { transform: scale(1.04); }
  .ws-pill-done { background: #7f1d1d; color: #fecaca; border-color: #dc2626; }
  .ws-pill-done.active { background: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
  
  .ws-pill-doing { background: #0c4a6e; color: #38bdf8; border-color: #0284c7; }
  .ws-pill-doing.active { background: #0284c7; color: #fff; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }

  .ws-pill-queue { background: #713f12; color: #fef08a; border-color: #ca8a04; }
  .ws-pill-queue.active { background: #eab308; color: #000; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }

  .ws-nav-btn {
    padding: 7px 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #cbd5e1;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ws-nav-btn:hover { background: #334155; color: #fff; border-color: var(--accent); }

  /* Workspace Scrollable Body */
  .workspace-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .workspace-content::-webkit-scrollbar { width: 6px; }
  .workspace-content::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  /* 2-COLUMN GRID IN WORKSPACE (ALL ON ONE SCREEN!) */
  .ws-grid-2cols {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 1280px) {
    .ws-grid-2cols { grid-template-columns: 1fr; }
    body { overflow: auto; height: auto; }
    .workspace { overflow: visible; }
  }

  /* Card Sections */
  .ws-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .ws-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #1e3a5f;
  }
  .ws-box-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Field Rows */
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px dashed #1e293b;
    gap: 12px;
  }
  .field-row:last-child { border-bottom: none; padding-bottom: 0; }
  .field-info { flex: 1; }
  .field-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .field-val-big {
    font-family: monospace;
    font-weight: 800;
  }
  .val-phone { font-size: 24px; color: var(--yellow); }
  .val-bank { font-size: 22px; color: var(--green); }
  .val-cccd { font-size: 21px; color: var(--purple); }
  .val-dob { font-size: 22px; color: #38bdf8; }
  .val-date { font-size: 20px; color: var(--emerald); }
  .val-expiry { font-size: 20px; color: var(--rose); }

  .sim-badge {
    background: #991b1b;
    color: #fecaca;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 800;
    border: 1px solid #ef4444;
    margin-left: 8px;
  }

  /* Address box */
  .address-box {
    background: #0d1729;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }
  .address-val {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    line-height: 1.4;
  }

  /* Salary Table in Workspace */
  .salary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .salary-table th {
    background: #091222;
    padding: 11px 14px;
    color: #93c5fd;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    border-bottom: 2px solid #1e3a5f;
    text-align: left;
  }
  .salary-table td {
    padding: 14px 14px;
    border-bottom: 1px solid #1e293b;
    vertical-align: middle;
  }
  .salary-table tr:hover { background: #162238; }
  .sal-amt-strong {
    font-size: 15px;
    font-weight: 800;
    color: var(--green);
    font-family: monospace;
  }
  .sal-bal-strong {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    font-family: monospace;
  }
  .sal-date-txt {
    font-size: 12px;
    color: #cbd5e1;
    font-weight: 600;
  }
  .sal-memo-txt {
    font-size: 10.5px;
    color: #94a3b8;
    font-family: monospace;
  }

  /* Copy Buttons */
  .btn-copy {
    background: #1e293b;
    border: 1px solid #334155;
    color: #cbd5e1;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
    white-space: nowrap;
  }
  .btn-copy:hover { background: #334155; border-color: var(--accent); color: #fff; }
  .btn-copy.copied { background: #15803d; border-color: #22c55e; color: #fff; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0284c7;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    z-index: 99999;
    display: none;
    font-size: 13.5px;
    border: 1px solid #38bdf8;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  
  .sidebar-tag-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .sidebar-tag-done { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
  .sidebar-tag-doing { background: #0c4a6e; color: #38bdf8; border: 1px solid #0284c7; }
  .sidebar-tag-queue { background: #713f12; color: #fef08a; border: 1px solid #ca8a04; }

  @media (max-width: 860px) {
    body {
      height: auto !important;
      min-height: 100vh !important;
      overflow-y: auto !important;
    }
    .app-body {
      flex-direction: column !important;
      height: auto !important;
      overflow: visible !important;
    }
    .sidebar {
      width: 100% !important;
      max-height: 320px !important;
      overflow-y: auto !important;
      border-right: none !important;
      border-bottom: 2px solid var(--border-color) !important;
    }
    .workspace {
      height: auto !important;
      overflow: visible !important;
    }
    .workspace-content {
      height: auto !important;
      overflow: visible !important;
      padding: 12px 10px !important;
    }
  }

  /* PIN LOCK SCREEN OVERLAY */
  #pinLockOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at center, #0d1a33 0%, #060a12 100%);
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .pin-card {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(56, 189, 248, 0.25);
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(2, 132, 199, 0.15);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pin-shield-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
  }
  .pin-title {
    font-size: 19px;
    font-weight: 800;
    color: #f8fafc;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .pin-subtitle {
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .pin-dots-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .pin-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #334155;
    background: transparent;
    transition: all 0.2s;
  }
  .pin-dot.filled {
    background: #38bdf8;
    border-color: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
    transform: scale(1.15);
  }
  .pin-dot.error {
    background: #ef4444;
    border-color: #ef4444;
    box-shadow: 0 0 10px #ef4444;
  }
  .pin-numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 18px;
  }
  .pin-btn {
    height: 60px;
    border-radius: 50%;
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pin-btn:active {
    background: #0284c7;
    transform: scale(0.92);
  }
  .pin-btn.action-btn {
    background: transparent;
    border-color: transparent;
    font-size: 14px;
    font-weight: 800;
    color: #94a3b8;
  }
  .pin-btn.action-btn:active {
    background: #334155;
  }
  .pin-remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #94a3b8;
    cursor: pointer;
  }
  .pin-error-msg {
    color: #f87171;
    font-size: 12.5px;
    font-weight: 700;
    min-height: 18px;
    margin-bottom: 12px;
  }

  /* MOBILE RESPONSIVE TWEAKS */
  @media (max-width: 860px) {
    .app-body {
      flex-direction: column !important;
      overflow-y: auto !important;
    }
    .sidebar {
      width: 100% !important;
      max-height: 240px !important;
      border-right: none !important;
      border-bottom: 2px solid var(--border-color) !important;
    }
    .ws-grid-2cols {
      grid-template-columns: 1fr !important;
    }
    .workspace-header {
      flex-wrap: wrap !important;
      gap: 10px !important;
      padding: 10px 14px !important;
    }
    .top-header {
      flex-wrap: wrap !important;
      gap: 10px !important;
      padding: 8px 12px !important;
    }
    .app-title { font-size: 14px !important; }
    .wallet-pill { width: 100% !important; justify-content: space-between !important; }
  }


  .sidebar-status-actions {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 5px;
  }
  .mini-status-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .mini-status-btn:hover {
    filter: brightness(1.2);
  }
  .mini-status-btn.btn-done.active {
    background: #7f1d1d;
    color: #fecaca;
    border-color: #ef4444;
  }
  .mini-status-btn.btn-doing.active {
    background: #0c4a6e;
    color: #38bdf8;
    border-color: #0284c7;
  }
  .mini-status-btn.btn-queue.active {
    background: #713f12;
    color: #fef08a;

let profilesData = [];
let currentPinInput = "";

async function decryptDataWithPin(pin) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(pin),
    { name: "PBKDF2" },
    false,
    ["deriveKey"]
  );
  const salt = Uint8Array.from(atob(ENCRYPTED_PAYLOAD.salt), c => c.charCodeAt(0));
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 100000,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const iv = Uint8Array.from(atob(ENCRYPTED_PAYLOAD.nonce), c => c.charCodeAt(0));
  const ciphertext = Uint8Array.from(atob(ENCRYPTED_PAYLOAD.cipher), c => c.charCodeAt(0));
  const decrypted = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: iv },
    key,
    ciphertext
  );
  return JSON.parse(new TextDecoder().decode(decrypted));
}

async function unlockWithPin(pin) {
  try {
    document.getElementById('pinErrorMsg').innerText = "Đang xác thực...";
    if (!profilesData || profilesData.length === 0) {
      profilesData = await decryptDataWithPin(pin);
    }
    
    if (document.getElementById('rememberPin') && document.getElementById('rememberPin').checked) {
      localStorage.setItem('app_saved_pin', pin);
    } else {
      sessionStorage.setItem('app_session_pin', pin);
    }

    currentPinInput = "";
    updatePinDots();
    document.getElementById('pinErrorMsg').innerText = "";

    const overlay = document.getElementById('pinLockOverlay');
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 250);

    selectMonth(currentMonth);
    setActiveProfile(activeFolder);
    showToast("🔓 Đã mở khóa thành công!");
    return true;
  } catch (err) {
    console.error("Decrypt error:", err);
    currentPinInput = "";
    updatePinDots();
    document.getElementById('pinErrorMsg').innerText = "❌ Mã PIN không chính xác!";
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach(d => d.classList.add('error'));
    setTimeout(() => {
      dots.forEach(d => d.classList.remove('error'));
      document.getElementById('pinErrorMsg').innerText = "";
    }, 900);
    return false;
  }
}

function lockAppNow() {
  currentPinInput = "";
  updatePinDots();
  const errMsg = document.getElementById('pinErrorMsg');
  if (errMsg) errMsg.innerText = "";
  
  localStorage.removeItem('app_saved_pin');
  sessionStorage.removeItem('app_session_pin');

  const overlay = document.getElementById('pinLockOverlay');
  if (overlay) {
    overlay.style.display = 'flex';
    overlay.style.opacity = '1';
  }
  showToast('🔒 Đã khóa ứng dụng an toàn!');
}

function updatePinDots() {
  const dots = document.querySelectorAll('.pin-dot');
  dots.forEach((d, idx) => {
    d.classList.toggle('filled', idx < currentPinInput.length);
  });
}

function pressPin(num) {
  if (currentPinInput.length < 6) {
    currentPinInput += num;
    updatePinDots();
    if (currentPinInput.length === 6) {
      unlockWithPin(currentPinInput);
    }
  }
}

function backspacePin() {
  if (currentPinInput.length > 0) {
    currentPinInput = currentPinInput.slice(0, -1);
    updatePinDots();
  }
}

function clearPin() {
  currentPinInput = "";
  updatePinDots();
}

// Handle physical keyboard for PIN
window.addEventListener('keydown', (e) => {
  const overlay = document.getElementById('pinLockOverlay');
  if (overlay && overlay.style.display !== 'none') {
    if (e.key >= '0' && e.key <= '9') {
      pressPin(e.key);
    } else if (e.key === 'Backspace') {
      backspacePin();
    } else if (e.key === 'Escape') {
      clearPin();
    }
  }
});



function copy(text, btn) {
  navigator.clipboard.writeText(text);
  if (btn) {
    const orig = btn.innerText;
    btn.innerText = '✓ Đã chép';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerText = orig;
      btn.classList.remove('copied');
    }, 1200);
  }
  showToast('Đã copy: ' + text);
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function selectMonth(m) {
  currentMonth = m;
  localStorage.setItem('app_selected_month', m);
  document.querySelectorAll('.btn-month').forEach(b => {
    b.classList.toggle('active', b.dataset.month === m);
  });
  renderProfileList();
  renderActiveProfile();
  updateWallet();
}

function getAllStatuses() {
  try {
    return JSON.parse(localStorage.getItem('app_all_statuses') || '{}');
  } catch (e) {
    return {};
  }
}

function getProfileStatus(folder) {
  const all = getAllStatuses();
  if (all[folder]) return all[folder];
  if (all[String(folder)]) return all[String(folder)];
  const p = (profilesData && profilesData.length) ? profilesData.find(item => item.folder === folder) : null;
  return p ? p.default_status : 'queue';
}


function removeVietnameseTones(str) {
  if (!str) return '';
  str = str.normalize('NFD').replace(/[̀-ͯ]/g, '');
  str = str.replace(/[đĐ]/g, m => m === 'đ' ? 'd' : 'D');
  return str;
}

function getSimSmsText(p) {
  if (!p) return '';
  const cleanCccd = p.cccd.replace(/\s+/g, '');
  const unaccentName = removeVietnameseTones(p.name).toUpperCase();
  
  let noiCap = removeVietnameseTones(p.noi_cap || 'BO CONG AN').toUpperCase();
  if (noiCap.includes('CANH SAT') || noiCap.includes('CS')) {
    noiCap = 'CUC CS QLHC VE TTXH';
  } else {
    noiCap = 'BO CONG AN';
  }

  const sim = (p.sim || 'Viettel').toLowerCase();
  let hotline = '198 (0d)';
  if (sim.includes('vina')) hotline = '18001091 (0d)';
  else if (sim.includes('mobi')) hotline = '18001090 (0d)';

  const birthYear = parseInt(p.dob.split('/')[2]) || 1995;
  const actYear = Math.min(2023, Math.max(birthYear + 18, 2020));
  const monthNum = String((p.folder % 8) + 1).padStart(2, '0');
  const actDate = `18/${monthNum}/${actYear}`;

  return `Ho ten: ${unaccentName}, ngay sinh: ${p.dob}, The can cuoc: ${cleanCccd}, noi cap: ${noiCap}, ngay cap: ${p.ngay_cap}. Loai thue bao: tra truoc, ngay kich hoat: ${actDate}. The can cuoc cua Quy khach dang ky su dung thue bao: ${p.phone}. Lien he ${hotline} de biet them thong tin chi tiet. Tran trong!`;
}

function cycleStatus(folder) {
  const current = getProfileStatus(folder);
  if (current === 'queue') setStatus(folder, 'doing');
  else if (current === 'doing') setStatus(folder, 'done');
  else setStatus(folder, 'queue');
}

function setStatus(folder, status) {
  const all = getAllStatuses();
  all[folder] = status;
  all[String(folder)] = status;
  try {
    localStorage.setItem('app_all_statuses', JSON.stringify(all));
    localStorage.setItem('status_' + folder, status);
    localStorage.setItem('profile_status_' + folder, status);
    if (currentMonth) {
      localStorage.setItem('status_' + currentMonth + '_' + folder, status);
    }
  } catch(e) {
    console.error('Save error:', e);
  }

  if (profilesData && profilesData.length) {
    const target = profilesData.find(item => item.folder === folder);
    if (target) target.default_status = status;
  }

  renderProfileList();
  renderActiveProfile();
  updateWallet();

  if (status === 'done') {
    showToast('🎉 +300.000 đ vào ví (Đã xong F' + folder + ')');
  } else if (status === 'doing') {
    showToast('🔵 Đã chuyển F' + folder + ' sang Đang làm');
  } else {
    showToast('🟡 Đã chuyển F' + folder + ' sang Chờ');
  }
}

function setActiveProfile(folder) {
  activeFolder = folder;
  localStorage.setItem('app_active_folder', folder);
  renderProfileList();
  renderActiveProfile();
}

function nextProfile(dir) {
  let currIdx = profilesData.findIndex(p => p.folder === activeFolder);
  let nextIdx = currIdx + dir;
  if (nextIdx < 0) nextIdx = profilesData.length - 1;
  if (nextIdx >= profilesData.length) nextIdx = 0;
  setActiveProfile(profilesData[nextIdx].folder);
}

function filterByStatus(tag) {
  currentFilter = tag;
  document.querySelectorAll('.chip-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === tag);
  });
  renderProfileList();
}

function filterSidebarSearch() {
  renderProfileList();
}

function updateWallet() {
  let done = 0;
  profilesData.forEach(p => {
    if (getProfileStatus(p.folder) === 'done') done++;

  const total = done * unitPrice;
  document.getElementById('walletBalance').innerHTML = total.toLocaleString('vi-VN') + ' <span>VNĐ</span>';
  document.getElementById('walletCount').innerText = done + '/12 bộ';
}

function getMonthParts(monthStr) {
  const mClean = monthStr.replace('T', '').trim(); // e.g. "09/2026"
  const parts = mClean.split('/');
  const mm = parts[0];
  const yyyy = parts[1];
  const yy = yyyy.substring(2);
  const mNum = parseInt(mm, 10);
  return { mm, yyyy, yy, mNum };
}

function getPersonPatternIndex(folderIdx) {
  const saved = localStorage.getItem('company_pattern_idx_' + folderIdx);
  if (saved !== null) return parseInt(saved, 10);
  // Default: map 1:1 to folder index
  return (folderIdx - 1) % companyTemplates.length;
}

function getRealisticMemo(folderIdx, monthStr, ownerName) {
  const pIdx = getPersonPatternIndex(folderIdx);
  const m = getMonthParts(monthStr);
  const templateFn = companyTemplates[pIdx] || companyTemplates[0];
  return templateFn(m, ownerName);
}

function copyFullSalaryStatement(folder) {
  const p = profilesData.find(item => item.folder === folder);
  if (!p) return;
  let text = '=== BẢNG KÊ LƯƠNG 4 THÁNG: ' + p.name + ' ===\n';
  text += 'Ngân hàng: ' + p.bank_name + ' - STK: ' + p.bank_stk + '\n';
  text += 'Chủ TK: ' + p.bank_owner + ' | ' + p.cycle + '\n';
  text += '-----------------------------------------------------\n';
  p.salaries.forEach(s => {
    text += s.month + ' | ' + s.date + ' (' + s.day_name + ')\n';
    text += '  + Tiền vào: +' + s.amount + ' đ\n';
    text += '  + Dư trước: ' + s.prev_bal + ' đ -> Dư sau: ' + s.new_bal + ' đ\n';
    text += '  + Memo: ' + getRealisticMemo(p.folder, s.month, p.bank_owner) + '\n\n';
  });
  navigator.clipboard.writeText(text);
  showToast('Đã copy toàn bộ bảng lương của ' + p.name);
}

// Keyboard shortcuts: Left/Right Arrow to switch profiles
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    nextProfile(-1);
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    nextProfile(1);
  } else if (e.key === '1') {
    setStatus(activeFolder, 'done');
  } else if (e.key === '2') {
    setStatus(activeFolder, 'doing');
  } else if (e.key === '3') {
    setStatus(activeFolder, 'queue');
  }
});

      <button class="pin-btn action-btn" onclick="clearPin()">XÓA</button>
      <button class="pin-btn" onclick="pressPin('0')">0</button>
      <button class="pin-btn action-btn" onclick="backspacePin()">⌫</button>
    </div>

    <label class="pin-remember">
      <input type="checkbox" id="rememberPin" checked> Ghi nhớ mở khóa trên máy này
    </label>
  </div>
</div>


  <!-- TOP HEADER DASHBOARD -->
  <div class="top-header">
    <div class="header-left">
      <div class="app-title">⚡ BẢNG TRA CỨU HỒ SƠ 12 BỘ</div>
      
      <!-- Month Buttons -->
      <div class="month-group">
        <span style="font-size:11px; color:#64748b; font-weight:800; padding:0 4px;">THÁNG:</span>
        <button class="btn-month" data-month="2026-08" onclick="selectMonth('2026-08')">T08</button>
        <button class="btn-month" data-month="2026-09" onclick="selectMonth('2026-09')">T09</button>
        <button class="btn-month" data-month="2026-10" onclick="selectMonth('2026-10')">T10</button>
        <button class="btn-month active" data-month="2026-11" onclick="selectMonth('2026-11')">⭐ T11 (Hiện tại)</button>
        <button class="btn-month" data-month="2026-12" onclick="selectMonth('2026-12')">T12</button>
      </div>
    </div>

    
    <button class="btn-copy" style="background:#7f1d1d; border-color:#ef4444; color:#fff; font-size:11.5px; padding:5px 10px; margin-left:6px;" onclick="lockAppNow()">🔒 Khóa Ngay</button>

    <!-- VIRTUAL WALLET -->
    <div class="wallet-pill">
      <div class="wallet-info">
        <div class="wallet-label">💎 VÍ ẢO (300K/HỒ SƠ)</div>
        <div class="wallet-val" id="walletBalance">0 <span>VNĐ</span></div>
      </div>
      <div class="wallet-count-badge" id="walletCount">0/12 bộ</div>
      <button class="btn-copy" style="background:#047857; border-color:#10b981; color:#fff;" onclick="copy(document.getElementById('walletBalance').innerText, this)">Copy Ví</button>
    </div>
  </div>

  <!-- APP BODY (SIDEBAR + WORKSPACE) -->
  <div class="app-body">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-filter-bar">
        <div class="sidebar-search">
          <input type="text" id="sidebarSearch" placeholder="🔍 Tìm tên, ngân hàng, SĐT..." onkeyup="filterSidebarSearch()">
        </div>
        <div class="status-chips-filter">
          <button class="chip-btn chip-all active" data-filter="all" onclick="filterByStatus('all')">Tất cả</button>
          <button class="chip-btn chip-doing" data-filter="doing" onclick="filterByStatus('doing')">🔵 Đang làm</button>
          <button class="chip-btn chip-queue" data-filter="queue" onclick="filterByStatus('queue')">🟡 Chờ</button>
          <button class="chip-btn chip-done" data-filter="done" onclick="filterByStatus('done')">🔴 Xong</button>
        </div>
      </div>

      <!-- Scrollable Profile Tabs -->
      <div class="profile-list" id="profileList">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- RIGHT WORKSPACE -->
    <div class="workspace">
      
      <!-- Workspace Action Header -->
      <div class="workspace-header">
        <div class="ws-header-left">
          <span class="ws-profile-badge" id="wsProfileBadge">F4</span>
          <span class="ws-profile-name" id="wsProfileName">PHAN THỊ LY PHA</span>
          <span class="ws-cycle-tag" id="wsCycleTag">Chu kỳ Mùng 10</span>
          <button class="btn-copy" style="margin-left:6px;" onclick="copy(document.getElementById('wsProfileName').innerText, this)">Copy Tên</button>
        </div>

        <div class="ws-header-right">
          <!-- 3 STATUS TAGS -->
          <div class="tag-switch-group">
            <span class="ws-tag-pill ws-pill-done" id="pillDone" onclick="setStatus(activeFolder, 'done')">🔴 Làm rồi (+300k)</span>
            <span class="ws-tag-pill ws-pill-doing" id="pillDoing" onclick="setStatus(activeFolder, 'doing')">🔵 Đang làm</span>
            <span class="ws-tag-pill ws-pill-queue" id="pillQueue" onclick="setStatus(activeFolder, 'queue')">🟡 Chưa làm (Chờ)</span>
          </div>

          <!-- Quick Navigation -->
          <div style="display:flex; gap:6px;">
            <button class="ws-nav-btn" onclick="nextProfile(-1)">◀ Trước</button>
            <button class="ws-nav-btn" onclick="nextProfile(1)">Tiếp ▶</button>
          </div>
        </div>
      </div>

      <!-- WORKSPACE 2-COLUMN VIEW (COMPLETELY FITS ON SCREEN WITHOUT SCROLLING!) -->
      <div class="workspace-content">
        <div class="ws-grid-2cols">
          
          <!-- COLUMN 1: IDENTITY, CCCD, SIM & ADDRESS -->
          <div class="ws-box" id="colIdentity">
            <!-- Rendered by JS -->
          </div>

          <!-- COLUMN 2: BANK & 4-MONTH SALARY TABLE -->
          <div class="ws-box" id="colSalary">
            <!-- Rendered by JS -->
          </div>

        </div>
      </div>

    </div>

  </div>

</body>
</html>
